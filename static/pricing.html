<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会员套餐 · 抖音AI科普短视频创作工作台</title>
<style>
body{margin:0;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:#F4F7F5;color:#1E293B}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:#fff;border-bottom:1px solid #E2E8F0}
.top a{color:#1B5E20;text-decoration:none;font-weight:600}.wrap{max-width:980px;margin:0 auto;padding:34px 20px}
h1{text-align:center;margin:0 0 6px}.sub{text-align:center;color:#64748B;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.plan{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:24px;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.plan.hot{border:2px solid #1B5E20}.plan h3{margin:0 0 8px;font-size:20px}.price{font-size:34px;font-weight:800;color:#1B5E20;margin:6px 0}
.price small{font-size:14px;color:#64748B;font-weight:500}.plan ul{padding-left:18px;line-height:1.9;color:#475569;font-size:14px;flex:1}
.btn{border:0;border-radius:10px;padding:11px;font-weight:700;font-size:15px;cursor:pointer;background:#1B5E20;color:#fff;margin-top:8px}
.btn.alt{background:#F1F5F9;color:#334155}.btn:disabled{opacity:.5;cursor:not-allowed}
.me{background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:22px;border:1px solid #E2E8F0;font-size:14px}
.note{margin-top:26px;font-size:13px;color:#64748B;line-height:1.8;background:#fff;border-radius:12px;padding:14px 18px;border:1px solid #E2E8F0}
</style></head><body>
<div class="top"><a href="/">🎨 抖音AI科普短视频创作工作台</a><a href="/">← 返回工作台</a></div>
<div class="wrap">
  <h1>💎 会员套餐</h1><div class="sub">按需选择，开通后立即提升每日生成次数</div>
  <div class="me" id="me">加载中...</div>
  <div class="grid" id="grid"></div>
  <div class="note" id="note"></div>
</div>
<script>
const h = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const yuan = c => (c / 100).toFixed(c % 100 ? (c % 10 ? 2 : 1) : 0);
let providers = [];
async function load() {
  const [cfg, meR] = await Promise.all([fetch('/api/plans').then(r => r.json()), fetch('/api/me')]);
  if (meR.status === 401) { location.href = '/login'; return; }
  const me = await meR.json(); providers = cfg.providers;
  document.getElementById('me').innerHTML = `👤 ${h(me.username)} · 当前：<b>${h(me.plan_name)}</b>` +
    (me.plan_expires ? `（到期 ${new Date(me.plan_expires * 1000).toLocaleDateString('zh-CN')}）` : '') +
    ` · 今日剩余 <b>${me.remaining === null ? '不限' : me.remaining + ' 次'}</b>`;
  const cards = [`<div class="plan"><h3>免费版</h3><div class="price">¥0</div><ul><li>每天 ${cfg.free_daily_quota} 次生成</li><li>中英双版本 / 横竖屏 / 配音音乐</li><li>先审稿再出图、单镜重绘</li></ul>
    <button class="btn alt" disabled>${me.plan === 'free' ? '当前套餐' : '基础权益'}</button></div>`];
  cfg.plans.forEach((p, i) => cards.push(`<div class="plan ${i === 0 ? 'hot' : ''}"><h3>${h(p.name)}</h3>
    <div class="price">¥${yuan(p.price_cents)} <small>/ ${p.days} 天</small></div>
    <ul><li>每天 ${p.daily_quota == null ? '<b>不限次数</b>' : '<b>' + p.daily_quota + '</b> 次生成'}</li><li>有效期 ${p.days} 天，续费自动顺延</li>${p.desc ? '<li>' + h(p.desc) + '</li>' : ''}</ul>
    ${providers.length ? providers.map(pv => `<button class="btn" onclick="buy('${p.id}','${pv.id}')">${pv.id === 'wechat' ? '微信支付' : pv.id === 'alipay' ? '支付宝' : h(pv.name)} 开通</button>`).join('')
      : '<button class="btn" disabled>在线支付暂未开通</button>'}</div>`));
  document.getElementById('grid').innerHTML = cards.join('');
  document.getElementById('note').innerHTML = `说明：每 ${cfg.regen_per_quota} 次“单镜重绘”折算 1 次生成（不足按 1 次计）；放弃待审核的剧本不计次数；生成失败不计次数。` +
    (providers.length ? '' : '<br>如需开通会员，请联系管理员手动开通。');
}
async function buy(plan, provider) {
  const r = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan, provider }) });
  const j = await r.json();
  if (!r.ok) return alert(j.detail || '下单失败');
  if (j.pay.type === 'mock') {
    if (!confirm(`【模拟支付·仅测试】订单 ${j.order_id}，金额 ¥${yuan(j.amount_cents)}。点击确定模拟支付成功。`)) return;
    const c = await fetch(j.pay.url, { method: 'POST' });
    alert(c.ok ? '开通成功！' : '支付失败'); return load();
  }
  if (j.pay.type === 'redirect') location.href = j.pay.url;
  else if (j.pay.type === 'qrcode') alert('请使用手机扫码支付：' + j.pay.url);
}
load();
</script></body></html>
